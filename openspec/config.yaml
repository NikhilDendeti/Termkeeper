schema: spec-driven

context: |
  Product: Payment Terms & Vendor Risk Analyzer — an advisory AI tool for the
  Razorpay AI Buildathon (Open Track). It ingests a freelance/vendor contract's
  text plus the actual Razorpay payout/subscription setup for that engagement,
  and produces a clause-by-clause risk report that flags where the contract's
  stated payment terms don't match what's actually happening on the payment rail.

  Core differentiator (do not weaken): stage 4 of the pipeline cross-checks
  contract-extracted terms against REAL RazorpayX Payout history (empirical
  cadence/amount derived from timestamps of real Payout records — RazorpayX has
  no queryable payout "schedule" config via API, only via dashboard, so history
  is the honest ground truth). A secondary/stretch path cross-checks against
  Razorpay Subscriptions + UPI Autopay config (period, interval, item.amount,
  total_count, max_amount, expire_at — these ARE real, independently GET-able
  fields, a true field diff). Never claim a "payout schedule config" exists on
  the Payouts side — it does not.

  Tech stack: Django + Django REST Framework, SQLite (Django's built-in
  backend, db.sqlite3 — no Docker, no external database service; chosen so
  the buildathon demo runs with zero infrastructure setup on any machine),
  OpenAI (Responses API) via forced JSON-schema structured output for every
  pipeline stage, razorpay Python SDK (+ raw requests fallback for
  late-wrapped fields), pytest, Django management commands as the
  operational CLI (ingest, run, report, eval), a server-rendered
  Django-templates report viewer in the `report_ui` app (kept, unmodified).

  As of `add-react-frontend`: a genuinely separate frontend also exists —
  `frontend/` is its own Vite + React + TypeScript project with its own
  package.json, talking to the Django backend only over HTTP (CORS-enabled
  JSON endpoints in `reporting`). This supersedes the earlier "Django-only
  end to end, no separate Node frontend" decision explicitly; see
  add-react-frontend/design.md's ADR for why `report_ui` was kept rather
  than removed. Two separate dev servers in local dev: `manage.py
  runserver` (:8000) and `npm run dev` in `frontend/` (:5173).

  Clean code / architecture conventions (HackSoft-style Django, enforce in every
  change): one Django app per bounded context (contracts, pipeline, integrations
  razorpay, evaluation), never one monolithic app. Views and DRF serializers
  stay thin — no business logic in views. All writes go through services.py
  (service functions, not classes, one clear function per use case). All
  non-trivial reads go through selectors.py. Models hold fields, constraints,
  and simple model-level validation only — no cross-model orchestration in
  models. Every service function and selector is typed (type hints throughout,
  mypy-clean). Tests live next to the code they test (tests/ per app), one test
  module per service/selector/endpoint, pytest + pytest-django, factory_boy for
  fixtures. Migrations are reviewed by hand before commit, never blindly
  autogenerated and left unread.

  Guardrails that apply to every change: the Razorpay integration layer issues
  ONLY read (GET) calls against any Razorpay resource that reflects a real
  user's live data — the only POST/write calls anywhere in the codebase are
  confined to test-mode fixture/demo-seeding code, clearly isolated from the
  production integration path. Every AI-produced risk flag or mismatch flag
  must carry its full reasoning chain (clause text -> classification ->
  extracted term -> platform evidence -> verdict) persisted and queryable, not
  just returned in an API response. A clause or term the pipeline cannot
  confidently resolve is stored with an explicit needs_human_review state, never
  silently forced into a best-guess score.

  Build order (each phase below is its own OpenSpec change, applied in order):
    1. add-django-foundation — project skeleton, apps, Contract/Clause/
       ExtractedTerm models, pipeline stages 1-3 (segmentation, classification,
       extraction) as services calling Claude with forced JSON schema, CLI
       ingest/run commands.
    2. add-razorpay-crosscheck — razorpay_integration app, PlatformRecord model,
       RazorpayConnector service (payout-history fetch + empirical cadence
       derivation as the primary path; Subscriptions/UPI Autopay token diff as
       the secondary path), pipeline stage 4, MismatchFlag model.
    3. add-risk-scoring-report — RiskAssessment model, pipeline stages 5-6
       (risk scoring with quote-grounding, and the pure-query aggregate
       report), report DRF endpoints + CLI report command.
    4. add-evaluation-harness — synthetic contract dataset generator, EvalLabel/
       EvalRun models, the held-out precision/recall/false-positive-cost scoring
       script, the Razorpay test-mode mismatch scenario fixtures.
    5. add-report-ui — Django-templates report viewer (clause list -> expand ->
       full reasoning chain), audit-log view, guardrail-verification view (proof
       the integration issues no write calls against live data).

rules:
  proposal:
    - State which of the five build-order phases this change implements, and
      name any other phase it must land after.
    - Include a one-paragraph "Non-goals" section naming what this phase
      deliberately defers to a later phase.
  specs:
    - Express every requirement as a testable SHALL statement scoped to one
      Django app.
    - Call out explicitly which requirements are new endpoints/services versus
      changes to an existing app from a prior phase.
  design:
    - Name every new Django app, its models, its services.py and selectors.py
      function signatures (name + args + return type), and its DRF
      serializers/views if any.
    - Justify any deviation from the HackSoft-style service/selector
      convention explicitly, or state "follows convention, no deviation."
  tasks:
    - Order tasks so migrations are created and reviewed before the services
      that depend on them.
    - Include a task for the pytest test module(s) for every new service and
      selector, not as an afterthought at the end.

operations:
  apply:
    guidance:
      - Run pytest for the affected app(s) before reporting a task done.
      - Keep services.py functions small — one use case per function; split
        rather than growing a function to cover a second use case.
  archive:
    guidance:
      - Summarize which SHALL requirements from this change's spec delta are
        now verified by a passing test, and flag any that are not.
